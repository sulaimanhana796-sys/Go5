<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام الأجور - GO v3.8</title>
    <!-- ✅ مكتبات jsPDF و autotable - أكثر موثوقية -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root { --bg: #0b1120; --card: #1e293b; --accent: #38bdf8; --purple: #8b5cf6; --red: #ef4444; --green: #10b981; --text: #e2e8f0; --paid: #22c55e; --unpaid: #f59e0b; --partial: #3b82f6; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: Tahoma, Arial, sans-serif; background: var(--bg); color: var(--text); padding: 12px; line-height: 1.6; padding-bottom: 80px; }
        .container { max-width: 100%; margin: 0 auto; }
        h1 { text-align: center; color: var(--accent); margin: 10px 0 15px; font-size: 1.5em; }
        .tag { background: var(--purple); color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 0.7em; }
        .card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #334155; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
        @media (max-width: 480px) { .grid { grid-template-columns: 1fr 1fr; } }
        label { display: block; margin-bottom: 5px; font-size: 0.85em; color: #94a3b8; }
        
        /* ✅ إصلاح الآيفون: حجم خط 16px يمنع التكبير التلقائي المعطل، و touch-action يحسن اللمس */
        input, textarea, select { 
            width: 100%; 
            padding: 12px 10px; 
            border: 1px solid #475569; 
            border-radius: 10px; 
            background: #0f172a; 
            color: #fff; 
            font-size: 16px; 
            direction: rtl; 
            font-family: inherit; 
            touch-action: manipulation;
        }
        textarea { min-height: 50px; resize: vertical; }
        
        .time-wrapper { display: flex; gap: 6px; align-items: flex-end; }
        .time-wrapper select { flex: 1; }
        .time-wrapper .colon { align-self: center; font-size: 1.2em; color: #64748b; padding-bottom: 12px; }
        
        .live-box { grid-column: 1/-1; background: #0f172a; padding: 14px; border-radius: 10px; text-align: center; margin-top: 8px; border: 1px dashed #475569; }
        .live-box span { color: var(--accent); font-size: 1.4em; font-weight: bold; }
        .live-box small { display: block; color: #64748b; margin-top: 4px; }
        
        .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        button { flex: 1; min-width: 120px; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.95em; color: #fff; touch-action: manipulation; }
        .btn-add { background: var(--accent); color: #0b1120; }
        .btn-update { background: linear-gradient(135deg, #f59e0b, #d97706); color: #0b1120; }
        .btn-save { background: linear-gradient(135deg, var(--green), #059669); }
        .btn-pdf { background: var(--purple); }
        .btn-del { background: var(--red); }
        .btn-util { background: #64748b; }
        .btn-paid { background: #22c55e; color: #0b1120; }
        .btn-edit { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85em; margin-left: 4px; }
        .btn-cancel { background: #64748b; }
        
        .empty { text-align: center; padding: 40px 20px; color: #64748b; font-size: 1.1em; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--green); color: #fff; padding: 12px 20px; border-radius: 10px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 1000; font-weight: bold; }
        .toast.show { opacity: 1; }
        .toast.err { background: var(--red); }
        
        .data-loaded { background: rgba(34,197,94,0.1); border: 1px solid var(--green); padding: 8px; border-radius: 8px; margin: 10px 0; font-size: 0.85em; color: var(--green); text-align: center; }
        .unsaved-warning { background: rgba(245,158,11,0.15); border: 1px solid var(--unpaid); padding: 8px; border-radius: 8px; margin: 10px 0; font-size: 0.85em; color: var(--unpaid); text-align: center; animation: pulse 2s infinite; }
        .editing-banner { background: rgba(245,158,11,0.2); border: 2px solid var(--unpaid); padding: 10px; border-radius: 8px; margin: 10px 0; font-size: 0.9em; color: var(--unpaid); text-align: center; font-weight: bold; }
        
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
        
        @media (max-width: 768px) {
            h1 { font-size: 1.3em; }
            .btns { flex-direction: column; }
            button { width: 100%; }
        }

        .dutch-section { direction: ltr; text-align: left; }
        .dutch-section label { text-align: left; }
        .dutch-section input, .dutch-section select { direction: ltr; text-align: left; }
        
        .dr-badge {
            position: fixed; bottom: 15px; left: 15px;
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: #fff; padding: 8px 14px; border-radius: 20px;
            font-size: 0.85em; font-weight: bold;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4);
            z-index: 999; display: flex; align-items: center; gap: 6px;
            pointer-events: none; user-select: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 نظام الأجور <span class="tag">GO v3.8</span></h1>
    
    <div id="dataLoadedMsg"></div>
    <div id="unsavedWarning"></div>
    <div id="editingBanner"></div>
    
    <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
            <h3 style="color:var(--green);">💾 البيانات المحفوظة</h3>
            <div id="statsBar" style="font-size:0.85em;color:#94a3b8;"></div>
        </div>
        <div class="btns">
            <button class="btn-save" onclick="saveToFile()">💾 حفظ في ملف</button>
            <button class="btn-util" onclick="exportJSON()">📥 تصدير JSON</button>
            <button class="btn-util" onclick="document.getElementById('impFile').click()">📤 استيراد JSON</button>
            <button class="btn-util" onclick="clearAllData()">🗑️ مسح الكل</button>
        </div>
    </div>
    
    <div class="card">
        <div class="grid">
            <div><label>👤 الاسم (Naam)</label><input type="text" id="inpName" list="nameList"></div>
            <datalist id="nameList"></datalist>
            <div><label>🏢 صاحب العمل (Werkgever)</label><input type="text" id="inpEmployer" list="employerList"></div>
            <datalist id="employerList"></datalist>
            <div><label>📱 رقم صاحب العمل (Tel.)</label><input type="text" id="inpEmployerPhone" placeholder="0612345678"></div>
            <div><label>📅 الشهر</label><input type="month" id="inpMonth"></div>
            <div><label>📅 التاريخ (Datum)</label><input type="date" id="inpDate"></div>
            <div><label>⏰ بداية (Start)</label>
                <div class="time-wrapper">
                    <select id="inpStartH"></select><span class="colon">:</span>
                    <select id="inpStartM"></select>
                </div>
            </div>
            <div><label>⏰ نهاية (Eind)</label>
                <div class="time-wrapper">
                    <select id="inpEndH"></select><span class="colon">:</span>
                    <select id="inpEndM"></select>
                </div>
            </div>
            <div><label>☕ استراحة (Pauze)</label>
                <select id="inpBreak">
                    <option value="0">0 min</option>
                    <option value="15">15 min</option>
                    <option value="30">30 min</option>
                    <option value="45">45 min</option>
                    <option value="60">60 min</option>
                </select>
            </div>
            <div><label>📍 المكان (Locatie)</label><input type="text" id="inpLoc" list="locList"></div>
            <datalist id="locList"></datalist>
            <div><label>💰 السعر/ساعة (Tarief)</label><input type="number" id="inpRate" step="0.5"></div>
            <div><label>🚗 كم (Km)</label><input type="number" id="inpKm" step="0.5"></div>
            <div style="grid-column:1/-1;"><label>📝 ملاحظات (Opmerkingen)</label><textarea id="inpNotes"></textarea></div>
        </div>
        <div class="live-box">
            💵 اليومي: <span id="liveTotal">0.00</span>
            <small id="liveDetail">أدخل البيانات</small>
            <small id="liveHours" style="color:var(--accent);">⏱️ الساعات المدفوعة: 0.0</small>
        </div>
        <div class="btns">
            <button id="addBtn" class="btn-add">➕ إضافة يوم (Toevoegen)</button>
            <button id="cancelEditBtn" class="btn-cancel" style="display:none;">❌ إلغاء التعديل</button>
            <button id="clearListBtn" class="btn-util">🧹 مسح القوائم</button>
        </div>
    </div>

    <div class="card dutch-section">
        <h3 style="color:var(--purple);margin-bottom:12px; text-align: left;">🇳🇱 Factuur / Urenoverzicht</h3>
        <div class="grid">
            <div>
                <label>Selecteer Werkgever:</label>
                <select id="dutchEmployerSelect">
                    <option value="all">Alle Werkgevers</option>
                </select>
            </div>
            <div>
                <label>Van (optioneel):</label>
                <input type="date" id="dutchFrom">
            </div>
            <div>
                <label>Tot (optioneel):</label>
                <input type="date" id="dutchTo">
            </div>
        </div>
        <div class="btns" style="justify-content: flex-start;">
            <button id="pdfDutchBtn" class="btn-pdf" style="min-width: 250px;">📥 Factuur PDF genereren (مباشر)</button>
        </div>
    </div>
</div>

<input type="file" id="impFile" accept=".json" style="display:none;">
<div id="toast" class="toast"></div>

<div class="dr-badge">⚙️ د. عبدالله</div>

<script id="savedDataScript">
const SAVED_DATA = {"entries":[],"names":[],"locs":[],"employers":[],"payments":{},"lastSave":"2026-07-06T10:00:00.000Z","version":"3.8"};
</script>

<script>
    let entries = [], names = new Set(), locs = new Set(), employers = new Set();
    let payments = {}, currentPayContext = null;
    let hasUnsavedChanges = false;
    let editingId = null;

    const els = {
        m: document.getElementById('inpMonth'), n: document.getElementById('inpName'),
        emp: document.getElementById('inpEmployer'), empPhone: document.getElementById('inpEmployerPhone'),
        d: document.getElementById('inpDate'), l: document.getElementById('inpLoc'),
        r: document.getElementById('inpRate'), k: document.getElementById('inpKm'), notes: document.getElementById('inpNotes'),
        brk: document.getElementById('inpBreak'),
        lt: document.getElementById('liveTotal'), ld: document.getElementById('liveDetail'), lh: document.getElementById('liveHours'),
        nl: document.getElementById('nameList'), ll: document.getElementById('locList'), el: document.getElementById('employerList'),
        t: document.getElementById('toast'), imp: document.getElementById('impFile'),
        sh: document.getElementById('inpStartH'), sm: document.getElementById('inpStartM'),
        eh: document.getElementById('inpEndH'), em: document.getElementById('inpEndM')
    };

    function initTimeSelects() {
        const fillSelect = (sel, start, end, step=1) => { 
            for(let i=start; i<=end; i+=step) sel.appendChild(new Option(String(i).padStart(2,'0'), String(i).padStart(2,'0'))); 
        };
        fillSelect(els.sh, 0, 23); fillSelect(els.eh, 0, 23);
        fillSelect(els.sm, 0, 55, 5); fillSelect(els.em, 0, 55, 5);
        // تعيين القيم الافتراضية بعد ملء الخيارات لضمان عملها في الآيفون
        setTimeout(() => {
            els.sh.value = '08'; els.sm.value = '00'; 
            els.eh.value = '16'; els.em.value = '00';
            calc(); // تحديث فوري بعد التعيين
        }, 50);
    }

    function calcHours() {
        // ✅ إضافة الأساس 10 لـ parseInt لمنع أخطاء تفسير الأرقام في بعض المتصفحات
        const startH = parseInt(els.sh.value, 10) || 0;
        const startM = parseInt(els.sm.value, 10) || 0;
        const endH = parseInt(els.eh.value, 10) || 0;
        const endM = parseInt(els.em.value, 10) || 0;
        const breakMins = parseInt(els.brk.value, 10) || 0;
        
        const startMins = startH * 60 + startM;
        const endMins = endH * 60 + endM;
        
        let diff = endMins - startMins;
        if (diff < 0) diff += 24 * 60; // التعامل مع الورديات الليلية
        
        let paidMins = diff - breakMins;
        if (paidMins < 0) paidMins = 0;
        
        return Math.round((paidMins / 60) * 2) / 2;
    }

    function migrateEntries() {
        entries.forEach(e => {
            if (!e.startTime) e.startTime = '';
            if (!e.endTime) e.endTime = '';
            if (e.notes === undefined) e.notes = '';
            if (e.rate === undefined) e.rate = 0;
            if (e.km === undefined) e.km = 0;
            if (e.transport === undefined) e.transport = 0;
            if (e.total === undefined) e.total = 0;
            if (e.hours === undefined) e.hours = 0;
            if (!e.id) e.id = Date.now() + Math.random();
            if (e.employer === undefined) e.employer = '';
            if (e.employerPhone === undefined) e.employerPhone = '';
            if (e.breakMins === undefined) e.breakMins = 0;
            if (e.name) e.name = e.name.trim();
            if (e.loc) e.loc = e.loc.trim();
            if (e.employer) e.employer = e.employer.trim();
            if (e.employerPhone) e.employerPhone = e.employerPhone.trim();
            if (e.notes) e.notes = e.notes.trim();
        });
    }

    function load() {
        try {
            if (typeof SAVED_DATA !== 'undefined' && SAVED_DATA.entries && SAVED_DATA.entries.length > 0) {
                entries = JSON.parse(JSON.stringify(SAVED_DATA.entries));
                if (SAVED_DATA.names) names = new Set(SAVED_DATA.names);
                if (SAVED_DATA.locs) locs = new Set(SAVED_DATA.locs);
                if (SAVED_DATA.employers) employers = new Set(SAVED_DATA.employers);
                if (SAVED_DATA.payments) payments = JSON.parse(JSON.stringify(SAVED_DATA.payments));
            }
            try {
                const localEntries = JSON.parse(localStorage.getItem('GO_entries_v3_8') || '[]');
                if (localEntries.length > 0) {
                    const existingIds = new Set(entries.map(e => e.id));
                    localEntries.forEach(e => { 
                        if (!existingIds.has(e.id)) entries.push(e); 
                        else {
                            const idx = entries.findIndex(ex => ex.id === e.id);
                            if (idx !== -1) entries[idx] = e;
                        }
                    });
                    const localNames = JSON.parse(localStorage.getItem('GO_names_v3_8') || '[]');
                    const localLocs = JSON.parse(localStorage.getItem('GO_locs_v3_8') || '[]');
                    const localEmps = JSON.parse(localStorage.getItem('GO_employers_v3_8') || '[]');
                    const localPayments = JSON.parse(localStorage.getItem('GO_payments_v3_8') || '{}');
                    localNames.forEach(n => names.add(n));
                    localLocs.forEach(l => locs.add(l));
                    localEmps.forEach(e => employers.add(e));
                    Object.keys(localPayments).forEach(key => { if (!payments[key]) payments[key] = localPayments[key]; });
                }
            } catch(e) { console.log('لا توجد بيانات محلية'); }
            
            migrateEntries();
            updateStats();
            const msgDiv = document.getElementById('dataLoadedMsg');
            msgDiv.innerHTML = `<div class="data-loaded">✅ تم تحميل ${entries.length} إدخال</div>`;
            setTimeout(() => { msgDiv.style.display = 'none'; }, 3000);
        } catch (err) { console.error('خطأ في التحميل:', err); }
    }

    function autoSave() {
        try {
            localStorage.setItem('GO_entries_v3_8', JSON.stringify(entries));
            localStorage.setItem('GO_names_v3_8', JSON.stringify([...names]));
            localStorage.setItem('GO_locs_v3_8', JSON.stringify([...locs]));
            localStorage.setItem('GO_employers_v3_8', JSON.stringify([...employers]));
            localStorage.setItem('GO_payments_v3_8', JSON.stringify(payments));
        } catch (err) { console.error('خطأ في الحفظ:', err); }
    }

    function updateStats() {
        document.getElementById('statsBar').innerHTML = `📊 ${entries.length} إدخال | 👤 ${names.size} اسم | 🏢 ${employers.size} صاحب عمل`;
        els.el.innerHTML = ''; 
        document.getElementById('dutchEmployerSelect').innerHTML = '<option value="all">Alle Werkgevers</option>';
        employers.forEach(v => {
            els.el.appendChild(new Option(v));
            document.getElementById('dutchEmployerSelect').appendChild(new Option(v, v));
        });
    }

    function markUnsaved() { 
        hasUnsavedChanges = true; 
        autoSave();
        document.getElementById('unsavedWarning').innerHTML = `<div class="unsaved-warning">⚠️ لديك تغييرات غير محفوظة! اضغط "💾 حفظ في ملف"</div>`;
    }

    function saveToFile() {
        try {
            const htmlContent = document.documentElement.outerHTML;
            const newData = { entries, names: [...names], locs: [...locs], employers: [...employers], payments, lastSave: new Date().toISOString(), version: '3.8' };
            const dataRegex = /const SAVED_DATA = \{[\s\S]*?\};/;
            const newScript = `const SAVED_DATA = ${JSON.stringify(newData)};`;
            const updatedHtml = htmlContent.replace(dataRegex, newScript);
            const blob = new Blob([updatedHtml], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'wages_system_v3.8.html';
            document.body.appendChild(a); a.click();
            setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
            hasUnsavedChanges = false;
            document.getElementById('unsavedWarning').innerHTML = '';
            showToast('✅ تم الحفظ في الملف!');
        } catch (err) { showToast('⚠️ خطأ في الحفظ', true); }
    }

    function exportJSON() {
        if (entries.length === 0) { showToast('⚠️ لا توجد بيانات', true); return; }
        const data = { entries, names: [...names], locs: [...locs], employers: [...employers], payments, exportDate: new Date().toISOString(), version: '3.8' };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `GO_backup_${new Date().toISOString().split('T')[0]}.json`;
        document.body.appendChild(a); a.click();
        setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
        showToast(`✅ تم تصدير ${entries.length} إدخال`);
    }

    els.imp.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            try {
                const data = JSON.parse(event.target.result.replace(/"\s*:/g, '":'));
                if (!data.entries || !Array.isArray(data.entries)) { showToast('⚠️ ملف غير صالح', true); return; }
                if (!confirm(`استيراد ${data.entries.length} إدخال؟`)) return;
                const existingIds = new Set(entries.map(e => e.id));
                let addedCount = 0;
                data.entries.forEach(e => { if (!existingIds.has(e.id)) { entries.push(e); addedCount++; } });
                if (data.names) data.names.forEach(n => names.add(n.trim()));
                if (data.locs) data.locs.forEach(l => locs.add(l.trim()));
                if (data.employers) data.employers.forEach(emp => employers.add(emp.trim()));
                if (data.payments) Object.assign(payments, data.payments);
                migrateEntries(); updateStats(); autoSave();
                showToast(`✅ تم استيراد ${addedCount} إدخال`);
            } catch (err) { showToast('⚠️ خطأ في الملف', true); }
        };
        reader.readAsText(file);
        setTimeout(() => { e.target.value = ''; }, 100);
    });

    function clearAllData() {
        if (!confirm('⚠️ حذف جميع البيانات؟')) return;
        if (!confirm('تأكيد نهائي؟')) return;
        entries = []; names.clear(); locs.clear(); employers.clear(); payments = {};
        localStorage.removeItem('GO_entries_v3_8'); localStorage.removeItem('GO_names_v3_8');
        localStorage.removeItem('GO_locs_v3_8'); localStorage.removeItem('GO_employers_v3_8');
        localStorage.removeItem('GO_payments_v3_8');
        updateStats();
        document.getElementById('unsavedWarning').innerHTML = '';
        showToast('🗑️ تم المسح');
    }

    function showToast(msg, err = false) {
        els.t.textContent = msg;
        els.t.className = 'toast show' + (err ? ' err' : '');
        setTimeout(() => els.t.className = 'toast', 2500);
    }

    function calc() {
        const hours = calcHours();
        const rate = parseFloat(els.r.value) || 0;
        const km = parseFloat(els.k.value) || 0;
        const transport = km * 0.20;
        const total = (hours * rate) + transport;
        els.lt.textContent = total.toFixed(2);
        els.ld.textContent = `(${hours}س × ${rate}) + (${km}كم × 0.20)`;
        els.lh.textContent = `⏱️ الساعات المدفوعة: ${hours.toFixed(1)}`;
    }

    // ✅ إصلاح الآيفون: استخدام addEventListener بدلاً من التعيين المباشر لضمان استجابة اللمس
    ['sh','sm','eh','em','r','k','brk'].forEach(id => { 
        if(els[id]) { 
            els[id].addEventListener('change', calc); 
            els[id].addEventListener('input', calc); 
        } 
    });

    document.getElementById('addBtn').onclick = () => {
        const name = els.n.value.trim();
        const date = els.d.value;
        if (!name || !date) { showToast('⚠️ الاسم والتاريخ مطلوبان', true); return; }
        const hours = calcHours();
        const rate = parseFloat(els.r.value) || 0;
        const km = parseFloat(els.k.value) || 0;
        const transport = km * 0.20;
        const total = (hours * rate) + transport;
        const startTime = `${els.sh.value}:${els.sm.value}`;
        const endTime = `${els.eh.value}:${els.em.value}`;
        const breakMins = parseInt(els.brk.value, 10) || 0;
        const employer = els.emp.value.trim();
        const employerPhone = els.empPhone.value.trim();
        
        if (editingId !== null) {
            const idx = entries.findIndex(e => e.id === editingId);
            if (idx !== -1) {
                entries[idx] = { ...entries[idx], name, date, employer, employerPhone, loc: els.l.value.trim(), rate, km, transport, total, hours, startTime, endTime, breakMins, notes: els.notes.value.trim() };
                names.add(name);
                if (els.l.value.trim()) locs.add(els.l.value.trim());
                if (employer) employers.add(employer);
                markUnsaved(); updateStats();
                showToast('✅ تم تحديث السجل');
                cancelEdit();
                return;
            }
        }
        
        entries.push({ name, date, employer, employerPhone, loc: els.l.value.trim(), rate, km, transport, total, hours, startTime, endTime, breakMins, notes: els.notes.value.trim(), id: Date.now() });
        names.add(name);
        if (els.l.value.trim()) locs.add(els.l.value.trim());
        if (employer) employers.add(employer);
        markUnsaved(); updateStats();
        showToast('✅ تم الإضافة');
        els.d.value = ''; els.notes.value = ''; els.k.value = ''; els.brk.value = '0'; els.empPhone.value = '';
        calc();
    };

    function editEntry(id) {
        const entry = entries.find(e => e.id === id);
        if (!entry) { showToast('⚠️ لم يتم العثور على السجل', true); return; }
        els.n.value = entry.name;
        els.emp.value = entry.employer || '';
        els.empPhone.value = entry.employerPhone || '';
        els.d.value = entry.date;
        els.l.value = entry.loc || '';
        els.r.value = entry.rate;
        els.k.value = entry.km;
        els.brk.value = entry.breakMins || 0;
        els.notes.value = entry.notes || '';
        if (entry.startTime && entry.startTime.includes(':')) {
            const parts = entry.startTime.split(':');
            els.sh.value = parts[0].padStart(2, '0'); els.sm.value = (parts[1] || '00').padStart(2, '0');
        }
        if (entry.endTime && entry.endTime.includes(':')) {
            const parts = entry.endTime.split(':');
            els.eh.value = parts[0].padStart(2, '0'); els.em.value = (parts[1] || '00').padStart(2, '0');
        }
        editingId = id;
        document.getElementById('addBtn').textContent = '✅ تحديث السجل';
        document.getElementById('addBtn').className = 'btn-update';
        document.getElementById('cancelEditBtn').style.display = 'block';
        document.getElementById('editingBanner').innerHTML = `<div class="editing-banner">✏️ تعديل: ${entry.name} - ${entry.date}</div>`;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        calc();
        showToast('📝 عدّل البيانات ثم اضغط "تحديث السجل"');
    }

    function cancelEdit() {
        editingId = null;
        document.getElementById('addBtn').textContent = '➕ إضافة يوم (Toevoegen)';
        document.getElementById('addBtn').className = 'btn-add';
        document.getElementById('cancelEditBtn').style.display = 'none';
        document.getElementById('editingBanner').innerHTML = '';
    }

    document.getElementById('cancelEditBtn').onclick = cancelEdit;

    document.getElementById('pdfDutchBtn').onclick = () => {
        const selectedEmp = document.getElementById('dutchEmployerSelect').value;
        const from = document.getElementById('dutchFrom').value;
        const to = document.getElementById('dutchTo').value;
        
        let filtered = entries.filter(e => {
            if (selectedEmp !== 'all' && e.employer !== selectedEmp) return false;
            if (from && e.date < from) return false;
            if (to && e.date > to) return false;
            return true;
        }).sort((a,b) => a.date.localeCompare(b.date));

        if (filtered.length === 0) {
            showToast('⚠️ Geen gegevens gevonden voor dit filter', true);
            return;
        }

        showToast('⏳ Generating PDF...');

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('portrait', 'mm', 'a4');
        
        doc.setFontSize(18);
        doc.setFont('helvetica', 'bold');
        doc.text('Factuur / Urenoverzicht', 105, 20, { align: 'center' });
        
        doc.setFontSize(11);
        doc.setFont('helvetica', 'normal');
        if (selectedEmp !== 'all') {
            doc.text(`Werkgever: ${selectedEmp}`, 105, 30, { align: 'center' });
        } else {
            doc.text('Alle Werkgevers', 105, 30, { align: 'center' });
        }
        
        if (from) {
            doc.setFontSize(10);
            doc.text(`Periode: ${from} tot ${to}`, 105, 37, { align: 'center' });
        }

        let grandTotal = 0, grandHours = 0;
        const tableData = filtered.map(e => {
            grandTotal += e.total;
            grandHours += e.hours;
            return [
                e.date,
                e.loc || '-',
                e.startTime || '-',
                e.endTime || '-',
                e.breakMins > 0 ? `${e.breakMins} min` : '-',
                e.hours.toString(),
                `€ ${e.rate.toFixed(2)}`,
                `€ ${e.total.toFixed(2)}`
            ];
        });

        doc.autoTable({
            startY: from ? 45 : 38,
            head: [['Datum', 'Locatie', 'Start', 'Eind', 'Pauze', 'Uren', 'Tarief', 'Totaal']],
            body: tableData,
            theme: 'grid',
            headStyles: { fillColor: [224, 224, 224], textColor: [0, 0, 0], fontStyle: 'bold', halign: 'center' },
            bodyStyles: { halign: 'center', textColor: [0, 0, 0] },
            foot: [[
                { content: 'Totaal:', colSpan: 5, styles: { halign: 'right', fontStyle: 'bold' } },
                { content: `${grandHours.toFixed(1)} uur`, styles: { fontStyle: 'bold' } },
                '-',
                { content: `€ ${grandTotal.toFixed(2)}`, styles: { fontStyle: 'bold', fontSize: 12 } }
            ]],
            footStyles: { fillColor: [224, 224, 224], textColor: [0, 0, 0], fontStyle: 'bold' },
            margin: { top: 20, left: 10, right: 10 }
        });

        const finalY = doc.lastAutoTable.finalY + 10;
        doc.setFontSize(10);
        doc.text(`Totaal aantal dagen: ${filtered.length}`, 105, finalY, { align: 'center' });

        doc.setFontSize(9);
        doc.setFont('helvetica', 'bold');
        doc.setTextColor(100, 100, 100);
        doc.text(`Systeem ontwikkeld door Dr. Abdullah © ${new Date().getFullYear()}`, 105, 285, { align: 'center' });

        const filename = `Factuur_${selectedEmp !== 'all' ? selectedEmp.replace(/\s+/g, '_') : 'Alle'}_${new Date().toISOString().split('T')[0]}.pdf`;
        doc.save(filename);
        
        showToast('✅ Factuur PDF gedownload!');
    };

    document.getElementById('clearListBtn').onclick = () => {
        if (!confirm('مسح القوائم (الأسماء، الأماكن، أصحاب العمل)؟')) return;
        names.clear(); locs.clear(); employers.clear();
        markUnsaved(); updateStats();
        showToast('🧹 تم مسح القوائم');
    };

    window.addEventListener('beforeunload', (e) => { if (hasUnsavedChanges) { e.preventDefault(); e.returnValue = '⚠️ لديك تغييرات غير محفوظة!'; } });
    setInterval(() => { if (hasUnsavedChanges) autoSave(); }, 30000);

    initTimeSelects();
    load();
    const today = new Date();
    els.d.value = today.toISOString().split('T')[0];
    els.m.value = today.toISOString().slice(0, 7);
    calc();
</script>

</body>
</html>
